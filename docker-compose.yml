services:

  mysql:
    image: mysql:8
    container_name: scam-mysql
    environment:
      MYSQL_DATABASE: scam_detection
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: scam-backend
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy