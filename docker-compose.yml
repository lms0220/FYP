services:

  mysql:
    image: mysql:8.0
    container_name: scam-mysql
    environment:
      MYSQL_DATABASE: scam_detection
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: ./backend
    container_name: scam-backend
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

    environment:
      # Set SECRET_KEY in a .env file next to this compose file (see .env.example).
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: mysql+pymysql://root:@mysql:3306/scam_detection
      # Ollama runs on the Windows host, outside Docker.
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: qwen3:8b
      OLLAMA_CONNECT_TIMEOUT: "5"
      OLLAMA_READ_TIMEOUT: "120"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: always


  frontend:
    build:
      context: ./frontend
    container_name: scam-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend


volumes:
  mysql_data:
